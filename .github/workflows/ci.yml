name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.5.18"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.0.0
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Validate theme YAML structure
        run: |
          uv run python - <<'EOF'
          import pathlib
          import re
          import yaml

          themes_dir = pathlib.Path("themes")
          files = sorted(themes_dir.glob("*.yaml"))
          assert files, "no themes found"
          for f in files:
              doc = yaml.safe_load(f.read_text())
              assert isinstance(doc, dict), f"{f.name}: not a mapping"
              assert doc.get("name"), f"{f.name}: missing name"
              assert doc.get("description"), f"{f.name}: missing description"
              colors = doc.get("colors")
              assert isinstance(colors, dict) and colors, f"{f.name}: missing colors"
              assert re.fullmatch(r"[a-z0-9][a-z0-9-]*", doc["name"]), f"{f.name}: unsafe slug"
              for key, val in colors.items():
                  if isinstance(val, str) and val.startswith("#"):
                      assert re.fullmatch(r"#[0-9a-fA-F]{6}", val), f"{f.name}: bad hex {key}={val}"
          print(f"OK: {len(files)} themes valid")
          EOF

      - name: Run theme pack test suite
        run: uv run pytest tests/ -q

      - name: Verify generated files are current
        # Regenerate themes/*.yaml + docs/preview.html from the seed palettes,
        # then fail if anything differs from what's committed. A contributor
        # who adds a theme (or edits a seed) must commit the regenerated
        # output; this keeps the gallery and the count invariants honest.
        run: |
          uv run python scripts/generate_themes.py
          if ! git diff --quiet -- themes/ docs/preview.html; then
            echo "::error::Generated files are out of date. Run 'uv run python scripts/generate_themes.py' and commit the regenerated themes/ and docs/preview.html."
            git diff --stat -- themes/ docs/preview.html
            exit 1
          fi
          echo "Generated files are current"

      - name: Syntax-check desktop plugin
        run: |
          uv run python -c "import ast; ast.parse(open('scripts/generate_themes.py').read())"
          if command -v node >/dev/null 2>&1; then node --check desktop-plugin/theme-switcher/plugin.js; else echo "node not present, skipping plugin syntax check"; fi
